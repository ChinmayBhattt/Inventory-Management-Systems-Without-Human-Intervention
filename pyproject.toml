[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-inventory-system"
version = "1.0.0"
description = "Pure Software-based Autonomous Inventory Management System"
authors = [{ name = "Autonomous Systems Team" }]
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

